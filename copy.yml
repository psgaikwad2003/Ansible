---
- name: Production Static Web Asset & Site Deployment
  hosts: web
  become: yes
  gather_facts: yes

  vars:
    web_root_dir: /var/www/html
    web_user: www-data
    web_group: www-data
    site_title: "Cloud Infrastructure Production Portal"
    site_environment: "Production"
    release_version: "v1.4.0"
    enable_backup: yes
    asset_subdirs:
      - assets/css
      - assets/js
      - assets/images
      - maintenance
      - .well-known

  tasks:
    - name: Ensure web document root and asset subdirectories exist with strict ownership
      file:
        path: "{{ web_root_dir }}/{{ item }}"
        state: directory
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0755"
      loop:
        - ""
        - assets/css
        - assets/js
        - assets/images
        - maintenance
        - .well-known
      tags:
        - web
        - setup

    - name: Deploy cluster healthz endpoint for ingress load balancers
      copy:
        dest: "{{ web_root_dir }}/healthz"
        content: |
          {"status":"healthy","release":"{{ release_version }}","node":"{{ ansible_hostname }}","timestamp":"{{ ansible_date_time.iso8601 }}"}
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"
      tags:
        - web
        - healthcheck

    - name: Deploy production index.html landing page
      copy:
        dest: "{{ web_root_dir }}/index.html"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{{ site_title }}</title>
              <style>
                  :root {
                      --bg: #0f172a;
                      --card: #1e293b;
                      --text: #f8fafc;
                      --accent: #38bdf8;
                      --border: #334155;
                  }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background-color: var(--bg);
                      color: var(--text);
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      min-height: 100vh;
                      margin: 0;
                  }
                  .card {
                      background: var(--card);
                      border: 1px solid var(--border);
                      border-radius: 12px;
                      padding: 2.5rem;
                      max-width: 600px;
                      width: 90%;
                      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                  }
                  h1 { color: var(--accent); margin-top: 0; }
                  .badge {
                      display: inline-block;
                      padding: 0.25rem 0.75rem;
                      background: #0284c7;
                      color: white;
                      border-radius: 9999px;
                      font-size: 0.85rem;
                      font-weight: 600;
                  }
                  .meta { margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; font-size: 0.9rem; color: #94a3b8; }
              </style>
          </head>
          <body>
              <div class="card">
                  <span class="badge">{{ site_environment }}</span>
                  <h1>{{ site_title }}</h1>
                  <p>Production cluster node provisioned and maintained via automated Ansible orchestration.</p>
                  <div class="meta">
                      <p><strong>Host:</strong> {{ ansible_hostname }} ({{ ansible_default_ipv4.address | default('localhost') }})</p>
                      <p><strong>Release:</strong> {{ release_version }}</p>
                      <p><strong>Last Deployed:</strong> {{ ansible_date_time.iso8601 }}</p>
                  </div>
              </div>
          </body>
          </html>
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"
        backup: "{{ enable_backup }}"
      notify: Reload Web Server
      tags:
        - web
        - deploy

    - name: Deploy custom 404 Not Found error page
      copy:
        dest: "{{ web_root_dir }}/404.html"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>404 Not Found</title>
          <style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;}
          .box{text-align:center;padding:2rem;background:#1e293b;border-radius:12px;border:1px solid #334155;}
          h1{color:#f43f5e;}</style></head>
          <body><div class="box"><h1>404 - Not Found</h1><p>The requested endpoint could not be resolved on this host.</p></div></body></html>
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"
      tags:
        - web

    - name: Deploy custom 500 and 503 Gateway Error templates
      copy:
        dest: "{{ web_root_dir }}/{{ item.file }}"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>{{ item.code }} {{ item.title }}</title>
          <style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;}
          .box{text-align:center;padding:2rem;background:#1e293b;border-radius:12px;border:1px solid #334155;}
          h1{color:#eab308;}</style></head>
          <body><div class="box"><h1>{{ item.code }} - {{ item.title }}</h1><p>{{ item.desc }}</p></div></body></html>
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"
      loop:
        - { file: "500.html", code: "500", title: "Internal Server Error", desc: "Our engineering operations team has been notified." }
        - { file: "503.html", code: "503", title: "Service Temporarily Unavailable", desc: "Upstream cluster is undergoing maintenance. Please retry shortly." }
      tags:
        - web

    - name: Deploy enterprise scheduled maintenance page
      copy:
        dest: "{{ web_root_dir }}/maintenance/index.html"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>Planned Maintenance</title>
          <style>body{font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;}
          .box{max-width:500px;text-align:center;padding:2.5rem;background:#1e293b;border-radius:12px;border:1px solid #38bdf8;}
          h1{color:#38bdf8;}</style></head>
          <body><div class="box"><h1>Scheduled Maintenance</h1><p>We are currently upgrading server systems. Services will resume shortly.</p></div></body></html>
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"
      tags:
        - web
        - maintenance

    - name: Deploy search engine robots.txt
      copy:
        dest: "{{ web_root_dir }}/robots.txt"
        content: |
          User-agent: *
          Disallow: /admin/
          Disallow: /private/
          Disallow: /maintenance/
          Allow: /
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"
      tags:
        - web

    - name: Generate static asset deployment manifest
      copy:
        dest: "{{ web_root_dir }}/asset_manifest.json"
        content: |
          {
            "release_version": "{{ release_version }}",
            "environment": "{{ site_environment }}",
            "deployed_node": "{{ ansible_hostname }}",
            "deployed_by": "Ansible Automation Engine",
            "deployed_at": "{{ ansible_date_time.iso8601 }}",
            "managed_assets": [
              "index.html",
              "healthz",
              "404.html",
              "500.html",
              "503.html",
              "maintenance/index.html",
              "robots.txt"
            ]
          }
        owner: "{{ web_user }}"
        group: "{{ web_group }}"
        mode: "0644"
      tags:
        - web
        - manifest

    - name: Verify static asset deployment and calculate checksums
      stat:
        path: "{{ web_root_dir }}/index.html"
        get_checksum: yes
      register: index_stat
      failed_when: not index_stat.stat.exists or index_stat.stat.size == 0
      tags:
        - verify

    - name: Audit asset inventory file count
      shell: "find {{ web_root_dir }} -type f | wc -l"
      register: asset_count
      changed_when: false
      tags:
        - verify

    - name: Display Asset Deployment Telemetry & Audit Summary
      debug:
        msg:
          - "=========================================================="
          - "  STATIC WEB ASSET DEPLOYMENT AUDIT SUMMARY               "
          - "=========================================================="
          - "Document Root    : {{ web_root_dir }}"
          - "Active Release   : {{ release_version }} ({{ site_environment }})"
          - "Index File Size  : {{ index_stat.stat.size }} bytes"
          - "Index SHA1 Hash  : {{ index_stat.stat.checksum }}"
          - "Total Web Assets : {{ asset_count.stdout | trim }} files verified"
          - "Asset Manifest   : {{ web_root_dir }}/asset_manifest.json"
          - "=========================================================="
      tags:
        - verify

  handlers:
    - name: Reload Web Server
      service:
        name: "{{ item }}"
        state: reloaded
      loop:
        - nginx
        - apache2
      failed_when: false
