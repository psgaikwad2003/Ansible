---
- name: Multi-User Onboarding, RBAC Team Provisioning & Shared Workspace Setup
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    primary_teams:
      - name: engineering
        gid: 2000
      - name: devops
        gid: 2001
      - name: compliance
        gid: 2002
    shared_workspaces:
      - path: "/opt/workspaces/engineering"
        group: "engineering"
        mode: "2775"
      - path: "/opt/workspaces/shared-artifacts"
        group: "engineering"
        mode: "2775"
    team_members:
      - name: dev1
        uid: 2101
        role: "Frontend Engineer"
        shell: /bin/bash
        primary_group: "engineering"
        secondary_groups: ["engineering"]
        sudo_tier: "developer"
      - name: dev2
        uid: 2102
        role: "Backend Engineer"
        shell: /bin/bash
        primary_group: "engineering"
        secondary_groups: ["engineering"]
        sudo_tier: "developer"
      - name: ops1
        uid: 2103
        role: "Lead Site Reliability Engineer"
        shell: /bin/bash
        primary_group: "devops"
        secondary_groups: ["devops", "engineering", "sudo"]
        sudo_tier: "admin"
      - name: sec1
        uid: 2104
        role: "Security & Compliance Auditor"
        shell: /bin/bash
        primary_group: "compliance"
        secondary_groups: ["compliance"]
        sudo_tier: "auditor"

  tasks:
    - name: Ensure all departmental team groups exist
      group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        state: present
      loop: "{{ primary_teams }}"
      loop_control:
        label: "{{ item.name }} (GID: {{ item.gid }})"
      tags:
        - identity
        - groups

    - name: Provision team member user accounts
      user:
        name: "{{ item.name }}"
        uid: "{{ item.uid }}"
        group: "{{ item.primary_group }}"
        groups: "{{ item.secondary_groups }}"
        append: yes
        shell: "{{ item.shell }}"
        comment: "{{ item.role }}"
        create_home: yes
        state: present
      loop: "{{ team_members }}"
      loop_control:
        label: "{{ item.name }} (UID: {{ item.uid }})"
      tags:
        - identity
        - users

    - name: Create secured SSH configuration directory for each user
      file:
        path: "/home/{{ item.name }}/.ssh"
        state: directory
        owner: "{{ item.name }}"
        group: "{{ item.primary_group }}"
        mode: "0700"
      loop: "{{ team_members }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - ssh
        - security

    - name: Provision shared collaboration workspaces with SGID bit
      file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        recurse: no
      loop: "{{ shared_workspaces }}"
      loop_control:
        label: "{{ item.path }} (Group: {{ item.group }})"
      tags:
        - workspaces
        - filesystem

    - name: Configure developer shell profile, history policies, and session timeout
      blockinfile:
        path: "/home/{{ item.name }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED SECURITY CONTROLS"
        block: |
          # Security isolation umask
          umask 027

          # Inactivity session auto-logout (30 minutes)
          readonly TMOUT=1800
          export TMOUT

          # Auditing history stamps
          HISTCONTROL=ignoredups:erasedups
          HISTSIZE=5000
          HISTTIMEFORMAT="%F %T "
          export HISTTIMEFORMAT
      loop: "{{ team_members }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - environment
        - security

    - name: Configure full sudo access for DevOps administrators
      copy:
        dest: "/etc/sudoers.d/95-role-{{ item.name }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          # DevOps Administrator Tier
          {{ item.name }} ALL=(ALL) NOPASSWD: ALL
      loop: "{{ team_members }}"
      when: item.sudo_tier == "admin"
      loop_control:
        label: "{{ item.name }} (Admin Tier)"
      tags:
        - sudo
        - rbac

    - name: Configure scoped service-management sudo access for developers
      copy:
        dest: "/etc/sudoers.d/95-role-{{ item.name }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          # Developer Scoped Tier (Service control and logs only)
          Cmnd_Alias DEV_SERVICES = /bin/systemctl status *, /bin/systemctl restart *, /bin/journalctl *
          {{ item.name }} ALL=(ALL) NOPASSWD: DEV_SERVICES
      loop: "{{ team_members }}"
      when: item.sudo_tier == "developer"
      loop_control:
        label: "{{ item.name }} (Developer Tier)"
      tags:
        - sudo
        - rbac

    - name: Configure read-only auditing sudo access for compliance auditors
      copy:
        dest: "/etc/sudoers.d/95-role-{{ item.name }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          # Compliance Auditor Tier (Audit logs and journal inspection)
          Cmnd_Alias AUDIT_CMDS = /usr/sbin/auditctl, /usr/sbin/ausearch, /bin/journalctl, /usr/bin/cat /var/log/*
          {{ item.name }} ALL=(ALL) NOPASSWD: AUDIT_CMDS
      loop: "{{ team_members }}"
      when: item.sudo_tier == "auditor"
      loop_control:
        label: "{{ item.name }} (Auditor Tier)"
      tags:
        - sudo
        - rbac

    - name: Verify user account status from passwd database
      getent:
        database: passwd
      tags:
        - verify

    - name: Display Team Provisioning and RBAC Audit Summary
      debug:
        msg: "Provisioned '{{ item.name }}' -> Role: {{ item.role }}, Tier: {{ item.sudo_tier }}, Primary: {{ item.primary_group }}, Shell: {{ ansible_facts.getent_passwd[item.name][5] }}."
      loop: "{{ team_members }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - verify
        - report