---
- name: Automated Multi-Database Backup Engine
  hosts: db
  become: yes

  vars:
    backup_base_dir: "/var/backups/databases"
    backup_script_path: "/usr/local/bin/backup-databases.sh"
    backup_log_path: "/var/log/db_backup.log"
    backup_date: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    backup_retention_days: 14
    mysql_backup_db: "production_db"
    mysql_backup_user: "root"
    mysql_backup_password: "RootSecurePassword@2026"
    postgres_backup_db: "production_db"
    postgres_backup_user: "postgres"
    backup_s3_bucket: "s3://company-cloud-backups-archive/db-snapshots"
    enable_s3_upload: true
    aws_default_region: "us-east-1"

  tasks:

    - name: Install Database Client and Compression Utilities
      apt:
        name:
          - mysql-client
          - postgresql-client-common
          - postgresql-client
          - gzip
          - pigz
          - coreutils
          - awscli
        state: present
        update_cache: yes

    - name: Create Dedicated Backup Directory Hierarchy
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ backup_base_dir }}"
        - "{{ backup_base_dir }}/mysql"
        - "{{ backup_base_dir }}/postgresql"
        - "{{ backup_base_dir }}/checksums"

    - name: Execute MySQL Database Backup with Gzip Compression
      shell: >
        mysqldump -u {{ mysql_backup_user }} -p'{{ mysql_backup_password }}'
        --single-transaction --quick --routines --triggers {{ mysql_backup_db }}
        | gzip -9 > {{ backup_base_dir }}/mysql/{{ mysql_backup_db }}_{{ backup_date }}.sql.gz
      args:
        executable: /bin/bash
      no_log: true
      ignore_errors: yes

    - name: Execute PostgreSQL Database Backup with Gzip Compression
      become_user: "{{ postgres_backup_user }}"
      shell: >
        pg_dump -Fc {{ postgres_backup_db }} > {{ backup_base_dir }}/postgresql/{{ postgres_backup_db }}_{{ backup_date }}.dump
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Generate SHA256 Integrity Checksums for Backups
      shell: >
        sha256sum {{ backup_base_dir }}/*/*{{ backup_date }}* > {{ backup_base_dir }}/checksums/checksums_{{ backup_date }}.sha256
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Sync Compressed Backups to Remote Cloud Storage (S3)
      shell: >
        aws s3 sync {{ backup_base_dir }} {{ backup_s3_bucket }}
        --exclude "*"
        --include "*{{ backup_date }}*"
        --region {{ aws_default_region }}
        --storage-class STANDARD_IA
      when: enable_s3_upload | bool
      ignore_errors: yes

    - name: Purge Local Backups Older than Retention Period
      find:
        paths:
          - "{{ backup_base_dir }}/mysql"
          - "{{ backup_base_dir }}/postgresql"
          - "{{ backup_base_dir }}/checksums"
        age: "{{ backup_retention_days }}d"
        recurse: yes
      register: expired_backups

    - name: Remove Expired Backup Archives
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ expired_backups.files }}"

    - name: Deploy Standalone Automated Backup Shell Script
      copy:
        dest: "{{ backup_script_path }}"
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "[$(date)] Starting scheduled database backup routine..." >> {{ backup_log_path }}
          
          # MySQL Dump
          if command -v mysqldump &> /dev/null; then
            mysqldump -u {{ mysql_backup_user }} -p'{{ mysql_backup_password }}' --single-transaction {{ mysql_backup_db }} | gzip -9 > {{ backup_base_dir }}/mysql/{{ mysql_backup_db }}_${TIMESTAMP}.sql.gz || true
          fi
          
          # PostgreSQL Dump
          if command -v pg_dump &> /dev/null; then
            su - {{ postgres_backup_user }} -c "pg_dump -Fc {{ postgres_backup_db }} > {{ backup_base_dir }}/postgresql/{{ postgres_backup_db }}_${TIMESTAMP}.dump" || true
          fi
          
          # Prune expired
          find {{ backup_base_dir }} -type f -mtime +{{ backup_retention_days }} -delete
          echo "[$(date)] Scheduled backup completed successfully." >> {{ backup_log_path }}

    - name: Schedule Daily Cron Job for Database Backups at 02:00 UTC
      cron:
        name: "Enterprise Multi-Database Automated Backup"
        minute: "0"
        hour: "2"
        job: "{{ backup_script_path }} >> {{ backup_log_path }} 2>&1"
        user: root
        state: present
