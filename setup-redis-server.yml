---
- name: Install and Harden Redis In-Memory Cache Server
  hosts: cache
  become: yes

  vars:
    redis_port: 6379
    redis_bind_interface: "127.0.0.1"
    redis_max_memory: "256mb"
    redis_max_memory_policy: "allkeys-lru"
    redis_password: "RedisSecretPassword@2026"
    redis_appendonly: "yes"
    redis_appendfsync: "everysec"
    redis_tcp_backlog: 65535
    redis_timeout: 300
    redis_tcp_keepalive: 300
    redis_save_snapshots:
      - "900 1"
      - "300 10"
      - "60 10000"
    redis_rename_dangerous_commands:
      - original: "FLUSHALL"
        renamed: '""'
      - original: "FLUSHDB"
        renamed: '""'
      - original: "DEBUG"
        renamed: '""'

  tasks:
    - name: Tune Linux Kernel Memory Overcommit for Redis Performance
      sysctl:
        name: vm.overcommit_memory
        value: "1"
        state: present
        reload: yes
      ignore_errors: yes

    - name: Tune Network Socket Max Connections for Redis
      sysctl:
        name: net.core.somaxconn
        value: "{{ redis_tcp_backlog }}"
        state: present
        reload: yes
      ignore_errors: yes

    - name: Install Redis Server and Tooling
      apt:
        name:
          - redis-server
          - redis-tools
        state: present
        update_cache: yes

    - name: Configure Redis Port
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^#?port "
        line: "port {{ redis_port }}"
        state: present
        backup: yes
      notify: Restart Redis

    - name: Configure Redis Bind Address
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^#?bind "
        line: "bind {{ redis_bind_interface }} ::1"
        state: present
      notify: Restart Redis

    - name: Configure Redis Protected Mode
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^#?protected-mode "
        line: "protected-mode yes"
        state: present
      notify: Restart Redis

    - name: Set Redis Memory Limit
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^#? ?maxmemory "
        line: "maxmemory {{ redis_max_memory }}"
        state: present
      notify: Restart Redis

    - name: Set Redis Memory Eviction Policy
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^#? ?maxmemory-policy "
        line: "maxmemory-policy {{ redis_max_memory_policy }}"
        state: present
      notify: Restart Redis

    - name: Set Redis Authentication Password
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^#? ?requirepass "
        line: "requirepass {{ redis_password }}"
        state: present
      notify: Restart Redis

    - name: Configure Redis TCP Keepalive and Timeout
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^#?timeout ", line: "timeout {{ redis_timeout }}" }
        - { regexp: "^#?tcp-keepalive ", line: "tcp-keepalive {{ redis_tcp_keepalive }}" }
      notify: Restart Redis

    - name: Configure Redis AOF Persistence
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^#?appendonly ", line: "appendonly {{ redis_appendonly }}" }
        - { regexp: "^#?appendfsync ", line: "appendfsync {{ redis_appendfsync }}" }
      notify: Restart Redis

    - name: Disable Dangerous Commands in Production
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^rename-command {{ item.original }} "
        line: "rename-command {{ item.original }} {{ item.renamed }}"
        state: present
      loop: "{{ redis_rename_dangerous_commands }}"
      notify: Restart Redis

    - name: Configure Redis Active Memory Defragmentation
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^#?activedefrag ", line: "activedefrag yes" }
        - { regexp: "^#?active-defrag-ignore-bytes ", line: "active-defrag-ignore-bytes 100mb" }
        - { regexp: "^#?active-defrag-threshold-lower ", line: "active-defrag-threshold-lower 10" }
        - { regexp: "^#?active-defrag-threshold-upper ", line: "active-defrag-threshold-upper 30" }
      notify: Restart Redis

    - name: Configure Dedicated Redis ACL Users Policy File
      copy:
        dest: /etc/redis/users.acl
        content: |
          user default on #{{ redis_password }} ~* &* +@all
          user app_reader on >AppReadOnlyPass@2026 ~* &* +@read -@write -@dangerous
        owner: redis
        group: redis
        mode: "0600"
      notify: Restart Redis

    - name: Enable ACL File in Redis Configuration
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^#?aclfile "
        line: "aclfile /etc/redis/users.acl"
        state: present
      notify: Restart Redis

    - name: Configure Systemd Resource Limits Override for Redis
      file:
        path: /etc/systemd/system/redis-server.service.d
        state: directory
        mode: "0755"

    - name: Deploy Redis Systemd LimitNOFILE Override
      copy:
        dest: /etc/systemd/system/redis-server.service.d/override.conf
        content: |
          [Service]
          LimitNOFILE=65535
        mode: "0644"
      notify:
        - Reload Systemd Daemon
        - Restart Redis

    - name: Ensure Redis Service is Started and Enabled
      service:
        name: redis-server
        state: started
        enabled: yes

    - name: Verify Redis Service Responsiveness via PING
      command: "redis-cli -p {{ redis_port }} -a '{{ redis_password }}' ping"
      register: redis_ping_result
      changed_when: false
      retries: 3
      delay: 2
      until: redis_ping_result.stdout == "PONG"
      ignore_errors: yes

    - name: Query Redis Operational Memory Metrics
      command: "redis-cli -p {{ redis_port }} -a '{{ redis_password }}' info memory"
      register: redis_mem_info
      changed_when: false
      failed_when: false

    - name: Display Redis Health and Memory Status
      debug:
        msg:
          - "=========================================================="
          - "  REDIS IN-MEMORY CACHE ENTERPRISE AUDIT SUMMARY          "
          - "=========================================================="
          - "Endpoint             : {{ redis_bind_interface }}:{{ redis_port }}"
          - "Max Memory & Policy  : {{ redis_max_memory }} ({{ redis_max_memory_policy }})"
          - "AOF Persistence      : {{ redis_appendonly }} (Sync: {{ redis_appendfsync }})"
          - "Active Defrag        : Enabled (10% - 30% Threshold)"
          - "ACL Security Policy  : Active in /etc/redis/users.acl"
          - "Ulimit NOFILE        : 65,535 (systemd override)"
          - "PING Check Result    : {{ redis_ping_result.stdout | default('Skipped / Offline') }}"
          - "=========================================================="

  handlers:
    - name: Reload Systemd Daemon
      systemd:
        daemon_reload: yes

    - name: Restart Redis
      service:
        name: redis-server
        state: restarted
