---
- name:Configuration application
  hosts: app
  become: yes

  vars:
    app_port: 8080
    db_host: 10.0.0.0

  tasks:
    - name: Deploy configuration
      template:
        src: app.conf.j2
        dest: /etc/myapp/app.conf
        owner: root
        group: root

  handlers:
    - name: Restart application
      service:
        name: myapp
        state: restarted