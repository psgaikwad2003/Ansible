---
- name: Enterprise Elasticsearch Single-Node Cluster Deployment & Memory Optimization
  hosts: elasticsearch_servers
  become: yes
  gather_facts: yes

  vars:
    elastic_branch: "8.x"
    es_cluster_name: "enterprise-search-cluster"
    es_node_name: "{{ inventory_hostname | default('es-node-01') }}"
    es_http_port: 9200
    es_transport_port: 9300
    es_data_dir: "/var/lib/elasticsearch"
    es_log_dir: "/var/log/elasticsearch"
    es_backup_dir: "/var/backups/elasticsearch"
    elastic_keyring: "/etc/apt/keyrings/elasticsearch-keyring.gpg"
    # Dynamic JVM Heap allocation (default: 50% system RAM, min 1GB, max 31GB)
    es_heap_size_override: ""
    enable_xpack_security: false

  handlers:
    - name: Reload Systemd
      systemd:
        daemon_reload: yes

    - name: Restart Elasticsearch
      systemd:
        name: elasticsearch
        state: restarted
        daemon_reload: yes

  tasks:
    - name: Calculate Optimal JVM Heap Sizing Based on Available System RAM
      set_fact:
        computed_heap_mb: "{{ [((ansible_memtotal_mb * 0.5) | int), 31744] | min }}"
      tags:
        - facts
        - memory

    - name: Set Final Elasticsearch Heap Memory Size Fact
      set_fact:
        es_final_heap_size: "{{ es_heap_size_override if es_heap_size_override != '' else (computed_heap_mb | string ~ 'm') }}"
      tags:
        - facts
        - memory

    - name: Install Base Dependencies and Security Libraries
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
          - default-jre-headless
          - ufw
          - jq
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - prerequisites
        - packages

    - name: Configure Linux Kernel Memory Maps for Elasticsearch (vm.max_map_count)
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-elasticsearch.conf
      loop:
        - { name: 'vm.max_map_count', value: '262144' }
        - { name: 'vm.swappiness', value: '1' }
        - { name: 'fs.file-max', value: '65536' }
      tags:
        - sysctl
        - memory

    - name: Configure Security Limits for Elasticsearch User
      copy:
        dest: /etc/security/limits.d/99-elasticsearch.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          elasticsearch soft memlock unlimited
          elasticsearch hard memlock unlimited
          elasticsearch soft nofile 65536
          elasticsearch hard nofile 65536
          elasticsearch soft nproc 4096
          elasticsearch hard nproc 4096
      tags:
        - limits

    - name: Ensure APT Keyrings Directory Exists
      file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - repo

    - name: Add Elastic Official GPG Key
      apt_key:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present
        keyring: "{{ elastic_keyring }}"
      tags:
        - repo

    - name: Add Elastic Official APT Repository
      apt_repository:
        repo: "deb [signed-by={{ elastic_keyring }}] https://artifacts.elastic.co/packages/{{ elastic_branch }}/apt stable main"
        state: present
        filename: elastic-{{ elastic_branch }}
      tags:
        - repo

    - name: Install Elasticsearch Package
      apt:
        name: elasticsearch
        state: present
        update_cache: yes
      tags:
        - packages
        - install

    - name: Create Snapshot Backup and Data Storage Directories
      file:
        path: "{{ item }}"
        state: directory
        owner: elasticsearch
        group: elasticsearch
        mode: "0750"
      loop:
        - "{{ es_data_dir }}"
        - "{{ es_log_dir }}"
        - "{{ es_backup_dir }}"
      tags:
        - directories

    - name: Configure Systemd Memory Lock Limits Override Directory
      file:
        path: /etc/systemd/system/elasticsearch.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - systemd

    - name: Deploy Systemd LimitMEMLOCK and LimitNOFILE Override Unit
      copy:
        dest: /etc/systemd/system/elasticsearch.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          LimitMEMLOCK=infinity
          LimitNOFILE=65536
          LimitNPROC=4096
      notify:
        - Reload Systemd
        - Restart Elasticsearch
      tags:
        - systemd

    - name: Configure Dynamic JVM Heap Allocation Options
      copy:
        dest: /etc/elasticsearch/jvm.options.d/heap.options
        owner: root
        group: elasticsearch
        mode: "0640"
        content: |
          # Elasticsearch Dynamic Memory Heap Allocation
          # Configured to 50% available host RAM to preserve OS filesystem caches
          -Xms{{ es_final_heap_size }}
          -Xmx{{ es_final_heap_size }}
      notify: Restart Elasticsearch
      tags:
        - config
        - memory

    - name: Deploy Production Elasticsearch Server Configuration
      copy:
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: elasticsearch
        mode: "0660"
        content: |
          # Elasticsearch Enterprise Node Configuration
          cluster.name: {{ es_cluster_name }}
          node.name: {{ es_node_name }}
          path.data: {{ es_data_dir }}
          path.logs: {{ es_log_dir }}
          path.repo: ["{{ es_backup_dir }}"]

          # Networking & Ports
          network.host: 0.0.0.0
          http.port: {{ es_http_port }}
          transport.port: {{ es_transport_port }}
          discovery.type: single-node

          # Memory & Locking
          bootstrap.memory_lock: true

          # Cluster Performance & Recovery Tuning
          indices.recovery.max_bytes_per_sec: "100mb"
          cluster.routing.allocation.node_concurrent_recoveries: 4

          # Security Settings
          xpack.security.enabled: {{ enable_xpack_security | lower }}
      notify: Restart Elasticsearch
      tags:
        - config

    - name: Flush Handlers to Ensure Elasticsearch is Started
      meta: flush_handlers

    - name: Ensure Elasticsearch Service is Enabled and Started
      systemd:
        name: elasticsearch
        state: started
        enabled: yes
      tags:
        - service

    - name: Configure UFW Firewall Ingress for HTTP and Transport Ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ es_http_port }}"
        - "{{ es_transport_port }}"
      when: ansible_facts['os_family'] == "Debian"
      ignore_errors: yes
      tags:
        - firewall

    - name: Verify Elasticsearch Cluster Health API Response
      uri:
        url: "http://127.0.0.1:{{ es_http_port }}/_cluster/health"
        method: GET
        status_code: 200
      register: es_health
      retries: 10
      delay: 5
      until: es_health.status == 200
      tags:
        - verification

    - name: Inspect Cluster Nodes Information via Cat API
      uri:
        url: "http://127.0.0.1:{{ es_http_port }}/_cat/nodes?format=json"
        method: GET
        status_code: 200
      register: es_nodes
      ignore_errors: yes
      tags:
        - verification

    - name: Output Elasticsearch Cluster Status Information
      debug:
        msg:
          - "=========================================================="
          - "  ELASTICSEARCH ENTERPRISE CLUSTER DEPLOYMENT SUMMARY     "
          - "=========================================================="
          - "Cluster Name          : {{ es_health.json.cluster_name }}"
          - "Cluster Status        : {{ es_health.json.status | upper }}"
          - "Active Primary Shards : {{ es_health.json.active_primary_shards }}"
          - "Allocated Heap Size   : {{ es_final_heap_size }}"
          - "Data Directory        : {{ es_data_dir }}"
          - "Snapshot Repository   : {{ es_backup_dir }}"
          - "HTTP Endpoint         : http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ es_http_port }}"
          - "Nodes Registered      : {{ es_nodes.json | length if es_nodes.json is defined else 1 }}"
          - "=========================================================="
      tags:
        - summary
