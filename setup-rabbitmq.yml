---
- name: Enterprise RabbitMQ Message Broker Architecture, HA Policies & Telemetry Hardening
  hosts: message_broker
  become: yes
  gather_facts: yes

  vars:
    rabbitmq_service_name: "rabbitmq-server"
    rabbitmq_admin_user: "admin"
    rabbitmq_admin_password: "AdminSecureRabbitPass@2026"
    rabbitmq_app_user: "app_worker"
    rabbitmq_app_password: "WorkerRabbitPass@2026"
    rabbitmq_vhost: "/production"
    rabbitmq_amqp_port: 5672
    rabbitmq_management_port: 15672
    rabbitmq_prometheus_port: 15692
    vm_memory_high_watermark: "0.4"
    disk_free_limit_relative: "1.5"
    erlang_cookie: "SECURE_ENTERPRISE_RABBITMQ_COOKIE_2026"
    erlang_packages:
      - erlang-base
      - erlang-asn1
      - erlang-crypto
      - erlang-eldap
      - erlang-inets
      - erlang-mnesia
      - erlang-os-mon
      - erlang-parsetools
      - erlang-public-key
      - erlang-ssl
      - erlang-syntax-tools
      - erlang-tools
      - erlang-xmerl

  tasks:
    - name: Install Erlang dependencies and prerequisites
      apt:
        name:
          - apt-transport-https
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - prerequisites

    - name: Install Erlang OTP core platform components
      apt:
        name: "{{ erlang_packages }}"
        state: present
      tags:
        - erlang

    - name: Install RabbitMQ Server engine
      apt:
        name: rabbitmq-server
        state: present
        update_cache: yes
      tags:
        - install
        - rabbitmq

    - name: Configure secure synchronized Erlang cookie across cluster nodes
      copy:
        dest: /var/lib/rabbitmq/.erlang.cookie
        content: "{{ erlang_cookie }}"
        owner: rabbitmq
        group: rabbitmq
        mode: "0400"
      notify: Restart RabbitMQ
      tags:
        - cluster
        - security

    - name: Deploy enterprise RabbitMQ configuration (rabbitmq.conf)
      copy:
        dest: /etc/rabbitmq/rabbitmq.conf
        owner: rabbitmq
        group: rabbitmq
        mode: "0644"
        content: |
          # Enterprise RabbitMQ Engine Tuning
          listeners.tcp.default = {{ rabbitmq_amqp_port }}
          management.tcp.port = {{ rabbitmq_management_port }}
          prometheus.tcp.port = {{ rabbitmq_prometheus_port }}

          # Resource thresholds
          vm_memory_high_watermark.relative = {{ vm_memory_high_watermark }}
          disk_free_limit.relative = {{ disk_free_limit_relative }}

          # Connection and heartbeat tuning
          heartbeat = 60
          tcp_listen_options.backlog = 4096
          tcp_listen_options.nodelay = true

          # Telemetry and logging
          log.file.level = info
      notify: Restart RabbitMQ
      tags:
        - config

    - name: Ensure RabbitMQ service is started and enabled on boot
      service:
        name: "{{ rabbitmq_service_name }}"
        state: started
        enabled: yes
      tags:
        - service

    - name: Enable RabbitMQ Management and Prometheus plugins
      rabbitmq_plugin:
        names:
          - rabbitmq_management
          - rabbitmq_prometheus
        state: enabled
      notify: Restart RabbitMQ
      tags:
        - plugins

    - name: Flush handlers to guarantee active plugins and configs
      meta: flush_handlers

    - name: Create production isolated Virtual Host
      rabbitmq_vhost:
        name: "{{ rabbitmq_vhost }}"
        state: present
      tags:
        - vhost

    - name: Provision RabbitMQ administrator user account
      rabbitmq_user:
        user: "{{ rabbitmq_admin_user }}"
        password: "{{ rabbitmq_admin_password }}"
        tags:
          - administrator
        vhost: "/"
        configure_priv: ".*"
        read_priv: ".*"
        write_priv: ".*"
        state: present
      tags:
        - security
        - users

    - name: Provision dedicated application worker user
      rabbitmq_user:
        user: "{{ rabbitmq_app_user }}"
        password: "{{ rabbitmq_app_password }}"
        tags:
          - management
        vhost: "{{ rabbitmq_vhost }}"
        configure_priv: ".*"
        read_priv: ".*"
        write_priv: ".*"
        state: present
      tags:
        - security
        - users

    - name: Delete default guest user account for security hardening
      rabbitmq_user:
        user: guest
        state: absent
      tags:
        - security

    - name: Configure High-Availability (HA) mirroring policy for queues
      rabbitmq_policy:
        name: "ha-all-queues"
        pattern: "^ha\\."
        vhost: "{{ rabbitmq_vhost }}"
        tags:
          ha-mode: "all"
          ha-sync-mode: "automatic"
        state: present
      tags:
        - policy
        - ha

    - name: Configure Dead-Letter-Exchange (DLX) retry policy
      rabbitmq_policy:
        name: "dlx-retry-policy"
        pattern: "^work\\."
        vhost: "{{ rabbitmq_vhost }}"
        tags:
          dead-letter-exchange: "amq.direct"
          dead-letter-routing-key: "dlx"
        state: present
      tags:
        - policy

    - name: Configure UFW firewall rules for AMQP, Management UI, and Metrics
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ rabbitmq_amqp_port }}"
        - "{{ rabbitmq_management_port }}"
        - "{{ rabbitmq_prometheus_port }}"
      ignore_errors: yes
      tags:
        - firewall

    - name: Verify cluster node status via rabbitmqctl
      command: rabbitmqctl status --formatter json
      register: cluster_status_json
      changed_when: false
      tags:
        - verify

    - name: Verify Prometheus metrics endpoint reachability
      uri:
        url: "http://127.0.0.1:{{ rabbitmq_prometheus_port }}/metrics"
        status_code: 200
        return_content: no
      register: prom_metrics_check
      retries: 3
      delay: 2
      tags:
        - verify

    - name: Display RabbitMQ Enterprise Cluster & Health Status
      debug:
        msg:
          - "================ RABBITMQ CLUSTER SUMMARY ================"
          - "AMQP Port        : {{ rabbitmq_amqp_port }}"
          - "Management UI    : http://127.0.0.1:{{ rabbitmq_management_port }}"
          - "Prometheus Scrape: http://127.0.0.1:{{ rabbitmq_prometheus_port }}/metrics"
          - "Virtual Host     : {{ rabbitmq_vhost }}"
          - "HA Mirroring     : Active (pattern: ^ha., mode: all)"
          - "Metrics Status   : Response code {{ prom_metrics_check.status }}"
          - "============================================================"
      tags:
        - verify
        - report

  handlers:
    - name: Restart RabbitMQ
      service:
        name: "{{ rabbitmq_service_name }}"
        state: restarted
