---
- name: Enterprise HAProxy High-Availability Load Balancer Deployment & Traffic Hardening
  hosts: loadbalancers
  become: yes
  gather_facts: yes

  vars:
    haproxy_service_name: "haproxy"
    haproxy_port: 80
    haproxy_https_port: 443
    haproxy_stats_port: 8404
    haproxy_stats_user: "admin"
    haproxy_stats_password: "{{ vault_haproxy_stats_password | default('AdminSecureStatsPass@2026') }}"
    max_connections: 50000
    backend_mode: "http"
    load_balance_algorithm: "roundrobin"
    enable_rate_limiting: true
    rate_limit_req_per_10s: 150
    enable_security_headers: true
    backend_servers:
      - name: "app_node_01"
        address: "192.168.1.101"
        port: 8080
      - name: "app_node_02"
        address: "192.168.1.102"
        port: 8080
      - name: "app_node_03"
        address: "192.168.1.103"
        port: 8080

  handlers:
    - name: Restart HAProxy
      service:
        name: "{{ haproxy_service_name }}"
        state: restarted

    - name: Reload HAProxy
      service:
        name: "{{ haproxy_service_name }}"
        state: reloaded

    - name: Restart Rsyslog
      service:
        name: rsyslog
        state: restarted

  tasks:
    - name: Update APT Cache and Install Prerequisites, Loggers and Tools
      apt:
        name:
          - curl
          - software-properties-common
          - rsyslog
          - socat
          - ufw
          - jq
          - logrotate
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - prerequisites
        - packages

    - name: Install HAProxy Package
      apt:
        name: haproxy
        state: present
      tags:
        - packages
        - install

    - name: Apply Kernel Sysctl Parameters for High-Throughput Load Balancing
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-haproxy.conf
      loop:
        - { name: 'net.ipv4.ip_nonlocal_bind', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }
        - { name: 'net.core.somaxconn', value: '65535' }
        - { name: 'net.ipv4.tcp_max_syn_backlog', value: '3240000' }
        - { name: 'net.ipv4.tcp_fin_timeout', value: '15' }
        - { name: 'net.ipv4.tcp_tw_reuse', value: '1' }
      tags:
        - sysctl
        - network

    - name: Configure Rsyslog for Isolated HAProxy Log Ingestion
      copy:
        dest: /etc/rsyslog.d/49-haproxy.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # HAProxy isolated syslog configuration
          $ModLoad imudp
          $UDPServerAddress 127.0.0.1
          $UDPServerRun 514

          local0.*    /var/log/haproxy.log
          & stop
      notify: Restart Rsyslog
      tags:
        - logging

    - name: Ensure Dedicated HAProxy Log File Exists with Safe Permissions
      file:
        path: /var/log/haproxy.log
        state: touch
        owner: syslog
        group: adm
        mode: "0640"
      changed_when: false
      tags:
        - logging

    - name: Create Custom HTTP Error Pages Directory
      file:
        path: /etc/haproxy/errors
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - config

    - name: Deploy Custom 429 Rate Limit Exceeded Error Template
      copy:
        dest: /etc/haproxy/errors/429.http
        owner: root
        group: root
        mode: "0644"
        content: |
          HTTP/1.0 429 Too Many Requests
          Cache-Control: no-cache
          Connection: close
          Content-Type: application/json

          {"error": "Too Many Requests", "status": 429, "message": "Request rate limit exceeded. Please throttle requests."}
      tags:
        - config

    - name: Backup Default HAProxy Configuration
      copy:
        src: /etc/haproxy/haproxy.cfg
        dest: /etc/haproxy/haproxy.cfg.bak
        remote_src: yes
        force: no
      tags:
        - config

    - name: Deploy Production HAProxy Configuration with Rate Limiting & Validation
      copy:
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: 'haproxy -c -f %s'
        content: |
          # HAProxy Enterprise Production Configuration
          global
              log 127.0.0.1 local0 notice
              chroot /var/lib/haproxy
              user haproxy
              group haproxy
              daemon
              stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
              stats timeout 30s
              maxconn {{ max_connections }}

              # Modern secure SSL/TLS defaults
              ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
              ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
              ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

          defaults
              log     global
              mode    {{ backend_mode }}
              option  httplog
              option  dontlognull
              option  forwardfor
              option  http-server-close
              timeout connect 5000ms
              timeout client  50000ms
              timeout server  50000ms
              timeout http-request 10000ms
              timeout http-keep-alive 5000ms
              retries 3
              errorfile 400 /etc/haproxy/errors/400.http
              errorfile 403 /etc/haproxy/errors/403.http
              errorfile 408 /etc/haproxy/errors/408.http
              errorfile 429 /etc/haproxy/errors/429.http
              errorfile 500 /etc/haproxy/errors/500.http
              errorfile 502 /etc/haproxy/errors/502.http
              errorfile 503 /etc/haproxy/errors/503.http
              errorfile 504 /etc/haproxy/errors/504.http

          # Dedicated Ingress HTTP Frontend
          frontend http_in
              bind *:{{ haproxy_port }}
              mode http
              http-request set-header X-Forwarded-Proto http

              {% if enable_rate_limiting | bool %}
              # Anti-Abuse Stick Table Rate Limiting
              stick-table type ip size 100k expire 30s store http_req_rate(10s)
              http-request track-sc0 src
              http-request deny deny_status 429 if { sc_http_req_rate(0) gt {{ rate_limit_req_per_10s }} }
              {% endif %}

              {% if enable_security_headers | bool %}
              # Production HTTP Security Headers
              http-response set-header X-Frame-Options "SAMEORIGIN"
              http-response set-header X-Content-Type-Options "nosniff"
              http-response set-header X-XSS-Protection "1; mode=block"
              http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
              {% endif %}

              default_backend backend_cluster

          # Application Backend Cluster Pool
          backend backend_cluster
              mode http
              balance {{ load_balance_algorithm }}
              option httpchk GET /health
              http-check expect status 200
              cookie SERVERID insert indirect nocache
              {% for server in backend_servers %}
              server {{ server.name }} {{ server.address }}:{{ server.port }} check inter 2000 rise 2 fall 3 cookie {{ server.name }}
              {% endfor %}

          # Metrics and Real-time Traffic Telemetry Dashboard
          listen stats
              bind *:{{ haproxy_stats_port }}
              mode http
              stats enable
              stats uri /
              stats refresh 10s
              stats auth {{ haproxy_stats_user }}:{{ haproxy_stats_password }}
              stats admin if TRUE
              stats show-legends
              stats show-node
      notify: Reload HAProxy
      tags:
        - config

    - name: Flush Handlers to Ensure HAProxy is Reconfigured
      meta: flush_handlers

    - name: Ensure HAProxy Service is Started and Enabled on Boot
      service:
        name: "{{ haproxy_service_name }}"
        state: started
        enabled: yes
      tags:
        - service

    - name: Allow Traffic in UFW Firewall for HTTP, HTTPS, and Stats
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ haproxy_port }}"
        - "{{ haproxy_https_port }}"
        - "{{ haproxy_stats_port }}"
      when: ansible_facts['os_family'] == "Debian"
      ignore_errors: yes
      tags:
        - firewall

    - name: Verify HAProxy Stats Interface Availability
      uri:
        url: "http://127.0.0.1:{{ haproxy_stats_port }}/"
        method: GET
        user: "{{ haproxy_stats_user }}"
        password: "{{ haproxy_stats_password }}"
        force_basic_auth: yes
        status_code: 200
      register: stats_response
      retries: 5
      delay: 2
      until: stats_response.status == 200
      tags:
        - verification

    - name: Inspect HAProxy Runtime Process Statistics via Admin Socket
      shell: "echo 'show info' | socat /run/haproxy/admin.sock stdio | grep -E '^(Name|Version|Uptime|Process_num|CurrConns|Maxconn):'"
      register: socket_info
      changed_when: false
      ignore_errors: yes
      tags:
        - verification

    - name: Output HAProxy Load Balancer Deployment Status
      debug:
        msg:
          - "=========================================================="
          - "  HAPROXY HIGH-AVAILABILITY LOAD BALANCER SUMMARY         "
          - "=========================================================="
          - "HAProxy Status         : Active and Running"
          - "HTTP Ingress Port      : {{ haproxy_port }}"
          - "Stats Dashboard URL    : http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ haproxy_stats_port }}/"
          - "Stats Dashboard User   : {{ haproxy_stats_user }}"
          - "Rate Limiting          : {{ 'Enabled (Max ' ~ rate_limit_req_per_10s ~ ' req/10s per IP)' if enable_rate_limiting else 'Disabled' }}"
          - "Security Headers       : {{ 'Enforced' if enable_security_headers else 'Disabled' }}"
          - "Configured Backends    : {{ backend_servers | length }} nodes registered"
          - "Socket Info            : {{ socket_info.stdout_lines | default(['Socket query unavailable']) }}"
          - "=========================================================="
      tags:
        - summary
