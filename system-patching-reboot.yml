---
- name: Enterprise Zero-Downtime Rolling OS Patching, Pre-flight Health Checks & Managed Reboot Orchestration
  hosts: all
  become: yes
  gather_facts: yes
  serial: "{{ patching_batch_size | default('25%') }}"
  max_fail_percentage: 0

  vars:
    reboot_timeout_seconds: 900
    pre_reboot_delay_seconds: 10
    post_reboot_delay_seconds: 20
    min_disk_free_mb_required: 2048
    patching_log_path: "/var/log/ansible-patching.log"

  tasks:
    - name: Record pre-patching kernel version and boot status
      set_fact:
        pre_patch_kernel: "{{ ansible_kernel }}"
        pre_patch_uptime: "{{ ansible_uptime_seconds }}"
      tags:
        - preflight

    - name: Pre-flight - Verify sufficient disk space in /var and /boot
      assert:
        that:
          - (item.size_available / 1024 / 1024) > min_disk_free_mb_required
        fail_msg: "Pre-flight failed: Mount {{ item.mount }} has less than {{ min_disk_free_mb_required }}MB free space available!"
        success_msg: "Pre-flight passed: Mount {{ item.mount }} has adequate free capacity."
      loop: "{{ ansible_mounts }}"
      when: item.mount in ['/', '/boot', '/var']
      tags:
        - preflight
        - safety

    - name: Pre-flight - Ensure no lingering dpkg lock files are active
      stat:
        path: /var/lib/dpkg/lock-frontend
      register: dpkg_lock
      tags:
        - preflight

    - name: Install update auditing and restart detection utilities
      apt:
        name:
          - needrestart
          - debian-goodies
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - prerequisites

    - name: Refresh APT package repository cache
      apt:
        update_cache: yes
        cache_valid_time: 0
      tags:
        - cache

    - name: Perform full distribution upgrade of all system packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: apt_upgrade_res
      tags:
        - upgrade

    - name: Check if system reboot is required by kernel or libraries
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      tags:
        - reboot-check

    - name: Inspect packages requesting system reboot if present
      command: cat /var/run/reboot-required.pkgs
      register: reboot_trigger_packages
      changed_when: false
      when: reboot_required_file.stat.exists
      failed_when: false
      tags:
        - reboot-check

    - name: Append patching execution audit record to system log
      copy:
        dest: "{{ patching_log_path }}"
        content: |
          [{{ ansible_date_time.iso8601 }}] Host: {{ ansible_hostname }} | Kernel Before: {{ pre_patch_kernel }} | Upgrade Changed: {{ apt_upgrade_res.changed }} | Reboot Needed: {{ reboot_required_file.stat.exists }}
        owner: root
        group: root
        mode: "0640"
      tags:
        - audit

    - name: Pre-reboot - Synchronize cached filesystem buffers to disk
      command: sync
      when: reboot_required_file.stat.exists
      changed_when: false
      tags:
        - reboot

    - name: Perform orchestrated conditional server reboot
      reboot:
        msg: "Scheduled OS update reboot initiated by Ansible patching automation"
        connect_timeout: 15
        reboot_timeout: "{{ reboot_timeout_seconds }}"
        pre_reboot_delay: "{{ pre_reboot_delay_seconds }}"
        post_reboot_delay: "{{ post_reboot_delay_seconds }}"
        test_command: whoami
      when: reboot_required_file.stat.exists
      tags:
        - reboot

    - name: Gather post-reboot system facts
      setup:
        gather_subset:
          - hardware
          - virtual
      when: reboot_required_file.stat.exists
      tags:
        - postflight

    - name: Post-flight - Validate that no critical systemd services are in a failed state
      command: systemctl --failed --no-legend
      register: post_failed_services
      changed_when: false
      failed_when: false
      tags:
        - postflight
        - verify

    - name: Display comprehensive OS patching and health audit summary
      debug:
        msg:
          - "================= [ PATCHING SUMMARY ] ================="
          - "Host: {{ ansible_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
          - "Kernel Before: {{ pre_patch_kernel }} | Current Kernel: {{ ansible_kernel }}"
          - "Reboot Executed: {{ reboot_required_file.stat.exists }}"
          - "Packages Upgraded: {{ 'Yes' if apt_upgrade_res.changed else 'None (Already up-to-date)' }}"
          - "Post-Patch Failed Units: {{ post_failed_services.stdout_lines | length if post_failed_services.stdout else 0 }}"
          - "Audit log written to: {{ patching_log_path }}"
          - "========================================================"
      tags:
        - verify
