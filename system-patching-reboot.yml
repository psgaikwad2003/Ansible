---
- name: Enterprise OS Patching and Managed Reboot
  hosts: all
  become: yes
  serial: "50%"

  vars:
    reboot_timeout_seconds: 600
    pre_reboot_delay_seconds: 5
    post_reboot_delay_seconds: 15

  tasks:

    - name: Update APT Package Cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade All System Packages to Latest Safe Versions
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Check if System Reboot is Required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Display Reboot Status
      debug:
        msg: "Host {{ inventory_hostname }} reboot required: {{ reboot_required_file.stat.exists }}"

    - name: Conditionally Reboot Server When Updates Require It
      reboot:
        msg: "Reboot initiated by Ansible system patching automation"
        connect_timeout: 10
        reboot_timeout: "{{ reboot_timeout_seconds }}"
        pre_reboot_delay: "{{ pre_reboot_delay_seconds }}"
        post_reboot_delay: "{{ post_reboot_delay_seconds }}"
        test_command: uptime
      when: reboot_required_file.stat.exists

    - name: Verify Post-Patching System Uptime
      command: uptime
      register: final_uptime
      changed_when: false

    - name: Display Post-Patching Uptime
      debug:
        msg: "Current uptime for {{ inventory_hostname }}: {{ final_uptime.stdout }}"
