---
- name: Production Docker Engine Setup, Hardened Container Deployment & Health Auditing
  hosts: docker
  become: yes
  gather_facts: yes

  vars:
    docker_packages:
      - docker.io
      - docker-compose-plugin
      - python3-docker
      - curl
      - jq
    app_container_name: "web-portal"
    app_image_name: "nginx"
    app_image_tag: "alpine"
    app_host_port: 8080
    app_container_port: 80
    app_network_name: "app-tier-net"
    container_cpu_limit: "1.5"
    container_memory_limit: "512m"
    container_memory_reservation: "256m"
    container_restart_policy: "unless-stopped"
    healthcheck_interval: "15s"
    healthcheck_timeout: "3s"
    healthcheck_retries: 3

  tasks:
    - name: Install Docker Engine, plugins, and container tooling
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - docker
        - install

    - name: Deploy hardened Docker daemon configuration (daemon.json)
      copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "20m",
              "max-file": "5"
            },
            "live-restore": true,
            "userland-proxy": false,
            "no-new-privileges": true,
            "storage-driver": "overlay2"
          }
      notify: Restart Docker
      tags:
        - docker
        - config

    - name: Ensure Docker daemon service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes
      tags:
        - docker
        - service

    - name: Flush handlers to apply Docker daemon tuning immediately
      meta: flush_handlers

    - name: Ensure isolated application bridge network exists
      command: >
        docker network create
        --driver bridge
        --opt "com.docker.network.bridge.name=br-appnet"
        {{ app_network_name }}
      register: network_create_res
      failed_when: false
      changed_when: network_create_res.rc == 0
      tags:
        - docker
        - network

    - name: Pull updated application container image
      command: "docker pull {{ app_image_name }}:{{ app_image_tag }}"
      register: pull_res
      changed_when: "'Downloaded newer image' in pull_res.stdout or 'Pull complete' in pull_res.stdout"
      tags:
        - docker
        - image

    - name: Check if existing container instance is running
      command: "docker ps -a --filter name=^{{ app_container_name }}$ --format '{% raw %}{{.ID}}{% endraw %}'"
      register: existing_container
      changed_when: false
      tags:
        - deploy

    - name: Gracefully stop and remove outdated container if running
      command: "docker rm -f {{ app_container_name }}"
      when: existing_container.stdout != ""
      tags:
        - deploy

    - name: Deploy sandboxed container with resource quotas and capabilities drop
      command: >
        docker run -d
        --name {{ app_container_name }}
        --network {{ app_network_name }}
        --restart {{ container_restart_policy }}
        --cpus "{{ container_cpu_limit }}"
        --memory {{ container_memory_limit }}
        --memory-reservation {{ container_memory_reservation }}
        --security-opt no-new-privileges:true
        --cap-drop ALL
        --cap-add NET_BIND_SERVICE
        --tmpfs /tmp:rw,noexec,nosuid,size=64m
        --tmpfs /run:rw,noexec,nosuid,size=16m
        --health-cmd "wget --quiet --tries=1 --spider http://127.0.0.1:{{ app_container_port }}/ || exit 1"
        --health-interval {{ healthcheck_interval }}
        --health-timeout {{ healthcheck_timeout }}
        --health-retries {{ healthcheck_retries }}
        -p {{ app_host_port }}:{{ app_container_port }}
        {{ app_image_name }}:{{ app_image_tag }}
      tags:
        - deploy

    - name: Wait for container to achieve healthy status
      command: "docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' {{ app_container_name }}"
      register: health_inspect
      until: health_inspect.stdout in ['healthy', '']
      retries: 6
      delay: 3
      changed_when: false
      failed_when: false
      tags:
        - verify
        - health

    - name: Audit active container resource metrics and status
      command: "docker inspect --format '{% raw %}Status: {{.State.Status}} | PID: {{.State.Pid}} | IP: {{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}{% endraw %}' {{ app_container_name }}"
      register: container_audit
      changed_when: false
      tags:
        - verify

    - name: Display Container Production Deployment Summary
      debug:
        msg:
          - "================ CONTAINER DEPLOYMENT AUDIT ================"
          - "Container Name   : {{ app_container_name }}"
          - "Image            : {{ app_image_name }}:{{ app_image_tag }}"
          - "Host Port Map    : 0.0.0.0:{{ app_host_port }} -> {{ app_container_port }}"
          - "Resource Quotas  : CPUs: {{ container_cpu_limit }} | Max Mem: {{ container_memory_limit }}"
          - "Healthcheck      : {{ health_inspect.stdout | default('Active') }}"
          - "Runtime Details  : {{ container_audit.stdout }}"
          - "============================================================"
      tags:
        - verify
        - report

  handlers:
    - name: Restart Docker
      service:
        name: docker
        state: restarted