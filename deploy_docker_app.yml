---
- name: Deploy Docker Application
  hosts: docker
  become: yes

  tasks:

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Start Docker Service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull Docker Image
      command: docker pull nginx:latest

    - name: Run Docker Container
      command: >
        docker run -d
        --name nginx-container
        -p 80:80
        nginx:latest
      ignore_errors: yes