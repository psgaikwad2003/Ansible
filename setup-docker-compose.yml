---
- name: Deploy Production Multi-Tier Microservices Architecture with Docker Compose
  hosts: docker
  become: yes
  gather_facts: yes

  vars:
    stack_dir: "/opt/microservices-stack"
    compose_project_name: "prod_stack"
    web_host_port: 8080
    redis_port: 6379
    redis_max_memory: "256mb"
    compose_systemd_service: "docker-compose-stack.service"
    stack_env_vars:
      COMPOSE_PROJECT_NAME: "prod_stack"
      APP_PORT: "8080"
      REDIS_PORT: "6379"
      NODE_ENV: "production"
      APP_LOG_LEVEL: "info"

  tasks:
    - name: Install Docker Compose plugin and system dependencies
      apt:
        name:
          - docker.io
          - docker-compose-plugin
          - python3-pip
          - curl
          - jq
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - packages
        - compose

    - name: Ensure Docker engine daemon is running and enabled
      service:
        name: docker
        state: started
        enabled: yes
      tags:
        - service

    - name: Create dedicated microservices stack directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ stack_dir }}"
        - "{{ stack_dir }}/nginx-conf"
        - "{{ stack_dir }}/logs"
      tags:
        - filesystem

    - name: Generate production environment configuration (.env)
      copy:
        dest: "{{ stack_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          # Production Stack Environment Variables
          {% for key, val in stack_env_vars.items() %}
          {{ key }}={{ val }}
          {% endfor %}
      tags:
        - config

    - name: Deploy custom Nginx reverse proxy configuration for Compose
      copy:
        dest: "{{ stack_dir }}/nginx-conf/default.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name localhost;

              location / {
                  root /usr/share/nginx/html;
                  index index.html;
              }

              location /healthz {
                  return 200 "OK\n";
                  add_header Content-Type text/plain;
              }
          }
      tags:
        - config

    - name: Deploy multi-tier Docker Compose specification
      copy:
        dest: "{{ stack_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          services:
            web:
              image: nginx:alpine
              container_name: compose-web-ingress
              restart: always
              ports:
                - "${APP_PORT}:80"
              volumes:
                - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
                - ./logs:/var/log/nginx
              depends_on:
                cache:
                  condition: service_healthy
              networks:
                - frontend-network
                - backend-network
              healthcheck:
                test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
                interval: 15s
                timeout: 3s
                retries: 3
                start_period: 5s
              deploy:
                resources:
                  limits:
                    cpus: '0.75'
                    memory: 256M

            cache:
              image: redis:7-alpine
              container_name: compose-redis-cache
              restart: always
              command: ["redis-server", "--maxmemory", "{{ redis_max_memory }}", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
              volumes:
                - redis-data:/data
              networks:
                - backend-network
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 3s
                retries: 3
                start_period: 5s
              deploy:
                resources:
                  limits:
                    cpus: '0.50'
                    memory: 256M

          volumes:
            redis-data:
              driver: local

          networks:
            frontend-network:
              driver: bridge
            backend-network:
              internal: true
      tags:
        - compose
        - config

    - name: Validate Docker Compose specification syntax
      command: docker compose config
      args:
        chdir: "{{ stack_dir }}"
      register: compose_config_test
      changed_when: false
      tags:
        - verify
        - validate

    - name: Pull updated images for Compose services
      command: docker compose pull
      args:
        chdir: "{{ stack_dir }}"
      register: compose_pull
      changed_when: "'Downloaded' in compose_pull.stdout"
      tags:
        - compose

    - name: Deploy Systemd unit for Docker Compose stack supervision
      copy:
        dest: "/etc/systemd/system/{{ compose_systemd_service }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Docker Compose Application Stack Service
          Requires=docker.service
          After=docker.service network.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory={{ stack_dir }}
          ExecStart=/usr/bin/docker compose up -d --remove-orphans
          ExecStop=/usr/bin/docker compose down
          ExecReload=/usr/bin/docker compose up -d --remove-orphans
          TimeoutStartSec=0

          [Install]
          WantedBy=multi-user.target
      notify: Reload Systemd
      tags:
        - systemd

    - name: Reload Systemd daemon
      systemd:
        daemon_reload: yes
      tags:
        - systemd

    - name: Enable and launch Docker Compose stack via Systemd
      service:
        name: "{{ compose_systemd_service }}"
        state: started
        enabled: yes
      tags:
        - service

    - name: Inspect running container statuses in Compose project
      command: docker compose ps --format json
      args:
        chdir: "{{ stack_dir }}"
      register: compose_ps_json
      changed_when: false
      tags:
        - verify

    - name: Display Microservices Stack Deployment Status
      debug:
        msg:
          - "================ COMPOSE STACK SUMMARY ================"
          - "Stack Directory : {{ stack_dir }}"
          - "Systemd Service : {{ compose_systemd_service }}"
          - "Ingress Port    : http://127.0.0.1:{{ web_host_port }}"
          - "Network Layout  : frontend-network (Bridge), backend-network (Isolated/Internal)"
          - "Container Count : {{ compose_ps_json.stdout_lines | length }}"
          - "========================================================="
      tags:
        - verify
        - report

  handlers:
    - name: Reload Systemd
      systemd:
        daemon_reload: yes
