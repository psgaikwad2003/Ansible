---
- name: Enterprise Firewall Hardening, Kernel Anti-DDoS & Traffic Control
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    firewall_default_incoming: deny
    firewall_default_outgoing: allow
    ssh_port: 22
    enable_ssh_rate_limiting: true
    allowed_web_ports:
      - { port: 80, proto: "tcp", comment: "HTTP Ingress" }
      - { port: 443, proto: "tcp", comment: "HTTPS Ingress" }
    internal_management_subnets:
      - { subnet: "10.0.0.0/8", port: 9100, comment: "Internal Prometheus Scrape" }
      - { subnet: "192.168.1.0/24", port: 9100, comment: "DevOps Monitoring Subnet" }
    firewall_logging_level: "medium"
    kernel_firewall_sysctl:
      - { name: "net.ipv4.tcp_syncookies", value: "1" }
      - { name: "net.ipv4.conf.all.rp_filter", value: "1" }
      - { name: "net.ipv4.conf.default.rp_filter", value: "1" }
      - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
      - { name: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }
      - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
      - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }
      - { name: "net.ipv4.conf.all.send_redirects", value: "0" }
      - { name: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
      - { name: "net.ipv4.tcp_synack_retries", value: "2" }
      - { name: "net.ipv4.tcp_rfc1337", value: "1" }
      - { name: "net.netfilter.nf_conntrack_max", value: "262144" }

  tasks:
    - name: Apply Linux Kernel Network & Anti-Spoofing sysctl Protections
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop: "{{ kernel_firewall_sysctl }}"
      loop_control:
        label: "{{ item.name }} = {{ item.value }}"
      ignore_errors: yes
      tags:
        - kernel
        - security

    - name: Ensure UFW and persistent firewall packages are installed
      apt:
        name:
          - ufw
          - iptables-persistent
          - conntrack
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - packages
        - ufw

    - name: Reset UFW to known baseline state (prevent stale or conflicting rules)
      ufw:
        state: reset
      tags:
        - firewall
        - baseline

    - name: Configure default inbound traffic policy
      ufw:
        direction: incoming
        default: "{{ firewall_default_incoming }}"
      tags:
        - firewall
        - policy

    - name: Configure default outbound traffic policy
      ufw:
        direction: outgoing
        default: "{{ firewall_default_outgoing }}"
      tags:
        - firewall
        - policy

    - name: Allow unrestricted traffic on loopback interface
      ufw:
        rule: allow
        interface: lo
        direction: "{{ item }}"
      loop:
        - in
        - out
      tags:
        - firewall
        - loopback

    - name: Enforce SSH access with anti-bruteforce rate limiting
      ufw:
        rule: "{{ 'limit' if enable_ssh_rate_limiting else 'allow' }}"
        port: "{{ ssh_port }}"
        proto: tcp
        comment: "SSH remote management (Rate-limited)"
      tags:
        - firewall
        - ssh

    - name: Allow standard web ingress traffic (HTTP / HTTPS)
      ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop: "{{ allowed_web_ports }}"
      loop_control:
        label: "Port {{ item.port }}/{{ item.proto }}"
      tags:
        - firewall
        - web

    - name: Allow scoped internal management subnet access for monitoring
      ufw:
        rule: allow
        from_ip: "{{ item.subnet }}"
        port: "{{ item.port }}"
        proto: tcp
        comment: "{{ item.comment }}"
      loop: "{{ internal_management_subnets }}"
      loop_control:
        label: "{{ item.subnet }} -> Port {{ item.port }}"
      tags:
        - firewall
        - internal

    - name: Configure UFW security logging level
      ufw:
        logging: "{{ firewall_logging_level }}"
      tags:
        - firewall
        - logging

    - name: Enable UFW firewall service and enforce ruleset
      ufw:
        state: enabled
      tags:
        - firewall
        - service

    - name: Query active firewall status
      command: ufw status verbose
      register: ufw_status_output
      changed_when: false
      tags:
        - verify

    - name: Inspect connection tracking table statistics
      shell: "sysctl net.netfilter.nf_conntrack_count 2>/dev/null || echo 'N/A'"
      register: conntrack_status
      changed_when: false
      tags:
        - verify
        - telemetry

    - name: Display Active Firewall Configuration & Audit Report
      debug:
        msg:
          - "================ UFW FIREWALL AUDIT ================"
          - "Default Policies  : Incoming: {{ firewall_default_incoming }} | Outgoing: {{ firewall_default_outgoing }}"
          - "SSH Rate Limiting : {{ 'Enabled' if enable_ssh_rate_limiting else 'Disabled' }} (Port {{ ssh_port }})"
          - "Logging Level     : {{ firewall_logging_level }}"
          - "Conntrack Count   : {{ conntrack_status.stdout }}"
          - "Active Rules:"
          - "{{ ufw_status_output.stdout_lines }}"
          - "==================================================="
      tags:
        - verify
        - report
