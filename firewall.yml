---
- name: Enterprise Firewall Hardening & Traffic Control (UFW)
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    firewall_default_incoming: deny
    firewall_default_outgoing: allow
    ssh_port: 22
    enable_ssh_rate_limiting: yes
    allowed_tcp_ports:
      - 80    # HTTP
      - 443   # HTTPS
    allowed_custom_rules: []
    firewall_logging_level: "low"

  tasks:
    - name: Ensure UFW package is installed
      apt:
        name:
          - ufw
          - iptables-persistent
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - install
        - ufw

    - name: Reset UFW to known baseline state (prevent stale rules)
      ufw:
        state: reset
      tags:
        - firewall
        - baseline

    - name: Configure default inbound traffic policy
      ufw:
        direction: incoming
        default: "{{ firewall_default_incoming }}"
      tags:
        - firewall
        - policy

    - name: Configure default outbound traffic policy
      ufw:
        direction: outgoing
        default: "{{ firewall_default_outgoing }}"
      tags:
        - firewall
        - policy

    - name: Configure SSH access rule (prevent lockout)
      ufw:
        rule: "{{ 'limit' if enable_ssh_rate_limiting else 'allow' }}"
        port: "{{ ssh_port }}"
        proto: tcp
        comment: "SSH remote management (Rate-limited)"
      tags:
        - firewall
        - ssh

    - name: Allow incoming web traffic ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        comment: "Allow inbound service port {{ item }}"
      loop: "{{ allowed_tcp_ports }}"
      tags:
        - firewall
        - web

    - name: Configure custom application firewall rules
      ufw:
        rule: "{{ item.rule | default('allow') }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto | default('tcp') }}"
        from_ip: "{{ item.from_ip | default('any') }}"
        comment: "{{ item.comment | default('Custom rule') }}"
      loop: "{{ allowed_custom_rules }}"
      when: allowed_custom_rules | length > 0
      tags:
        - firewall
        - custom

    - name: Set UFW logging level
      ufw:
        logging: "{{ firewall_logging_level }}"
      tags:
        - firewall
        - logging

    - name: Enable UFW service
      ufw:
        state: enabled
      tags:
        - firewall
        - service

    - name: Query active firewall status
      command: ufw status verbose
      register: ufw_status
      changed_when: false
      tags:
        - verify

    - name: Display Active Firewall Configuration
      debug:
        msg: "{{ ufw_status.stdout_lines }}"
      tags:
        - verify
