---
- name: Infrastructure Connectivity, Latency Benchmarking & System Health Audit
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    network_check_targets:
      - host: "8.8.8.8"
        name: "Google Public DNS"
      - host: "1.1.1.1"
        name: "Cloudflare DNS"
    dns_test_domains:
      - "google.com"
      - "github.com"
    ping_timeout_seconds: 3
    ping_count: 3
    memory_warn_threshold_percent: 85
    disk_warn_threshold_percent: 85
    audit_log_path: "/var/log/ansible-node-health.json"
    generate_audit_file: true

  tasks:
    - name: Test Ansible control plane connectivity
      ping:
        data: pong
      register: ping_control_plane
      tags:
        - connectivity
        - ping

    - name: Benchmark gateway and outbound ICMP latency
      shell: >
        ping -c {{ ping_count }} -W {{ ping_timeout_seconds }} {{ item.host }} |
        awk -F '/' 'END { if (NR>0 && NF>=5) print $5; else print "N/A" }'
      loop: "{{ network_check_targets }}"
      loop_control:
        label: "{{ item.name }} ({{ item.host }})"
      register: icmp_latency_results
      changed_when: false
      failed_when: false
      tags:
        - network
        - benchmark

    - name: Verify outbound DNS name resolution
      command: "getent hosts {{ item }}"
      loop: "{{ dns_test_domains }}"
      register: dns_resolution_results
      changed_when: false
      failed_when: false
      tags:
        - network
        - dns

    - name: Collect detailed system load averages
      shell: cat /proc/loadavg | awk '{print $1, $2, $3}'
      register: load_avg_output
      changed_when: false
      tags:
        - telemetry
        - load

    - name: Gather current system uptime
      command: uptime -p
      register: system_uptime
      changed_when: false
      tags:
        - facts
        - health

    - name: Calculate memory and swap utilization metrics
      set_fact:
        mem_used_mb: "{{ ansible_memtotal_mb - ansible_memfree_mb }}"
        mem_used_percent: "{{ ((ansible_memtotal_mb - ansible_memfree_mb) / ansible_memtotal_mb * 100) | round(2) }}"
        swap_total_mb: "{{ ansible_swaptotal_mb | default(0) }}"
        swap_used_mb: "{{ (ansible_swaptotal_mb | default(0)) - (ansible_swapfree_mb | default(0)) }}"
      tags:
        - telemetry
        - memory

    - name: Inspect root filesystem usage
      set_fact:
        root_mount_info: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first }}"
      tags:
        - telemetry
        - storage

    - name: Calculate disk space usage percentage
      set_fact:
        root_disk_used_percent: "{{ (((root_mount_info.size_total - root_mount_info.size_available) / root_mount_info.size_total) * 100) | round(2) }}"
        root_disk_free_gb: "{{ (root_mount_info.size_available / 1024 / 1024 / 1024) | round(2) }}"
        root_disk_total_gb: "{{ (root_mount_info.size_total / 1024 / 1024 / 1024) | round(2) }}"
      tags:
        - telemetry
        - storage

    - name: Check for any degraded or failed systemd services
      command: systemctl --failed --no-legend --plain
      register: failed_services_output
      changed_when: false
      failed_when: false
      tags:
        - health
        - services

    - name: Count failed services
      set_fact:
        failed_service_count: "{{ (failed_services_output.stdout_lines | length) if failed_services_output.stdout != '' else 0 }}"
      tags:
        - health
        - services

    - name: Record structured node health audit report
      copy:
        dest: "{{ audit_log_path }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          {
            "timestamp": "{{ ansible_date_time.iso8601 }}",
            "hostname": "{{ ansible_hostname }}",
            "fqdn": "{{ ansible_fqdn }}",
            "ip_address": "{{ ansible_default_ipv4.address | default('N/A') }}",
            "os": "{{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_distribution_release }})",
            "kernel": "{{ ansible_kernel }}",
            "uptime": "{{ system_uptime.stdout }}",
            "cpu_cores": {{ ansible_processor_vcpus }},
            "load_average": "{{ load_avg_output.stdout }}",
            "memory": {
              "total_mb": {{ ansible_memtotal_mb }},
              "used_mb": {{ mem_used_mb }},
              "used_percent": {{ mem_used_percent }}
            },
            "swap": {
              "total_mb": {{ swap_total_mb }},
              "used_mb": {{ swap_used_mb }}
            },
            "root_disk": {
              "total_gb": {{ root_disk_total_gb }},
              "free_gb": {{ root_disk_free_gb }},
              "used_percent": {{ root_disk_used_percent }}
            },
            "failed_systemd_services": {{ failed_service_count }},
            "ansible_ping": "{{ ping_control_plane.ping }}"
          }
      when: generate_audit_file | bool
      tags:
        - audit
        - reporting

    - name: Display Comprehensive Host Health Diagnostic Summary
      debug:
        msg:
          - "================ HOST HEALTH & TELEMETRY AUDIT ================"
          - "Hostname         : {{ ansible_hostname }} ({{ ansible_fqdn }})"
          - "OS Distribution  : {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_distribution_release }})"
          - "Kernel / Arch    : {{ ansible_kernel }} ({{ ansible_architecture }})"
          - "System Uptime    : {{ system_uptime.stdout | default('N/A') }}"
          - "CPU Architecture : {{ ansible_processor_vcpus }} vCPU(s) | Load: {{ load_avg_output.stdout }}"
          - "Memory Usage     : {{ mem_used_percent }}% ({{ mem_used_mb }} MB / {{ ansible_memtotal_mb }} MB)"
          - "Root Disk Usage  : {{ root_disk_used_percent }}% ({{ root_disk_free_gb }} GB free of {{ root_disk_total_gb }} GB)"
          - "Default IPv4     : {{ ansible_default_ipv4.address | default('N/A') }} (Interface: {{ ansible_default_ipv4.interface | default('N/A') }})"
          - "Failed Services  : {{ failed_service_count }} failed unit(s)"
          - "Ansible Ping     : {{ ping_control_plane.ping }}"
          - "Audit Log Saved  : {{ audit_log_path if (generate_audit_file | bool) else 'Disabled' }}"
          - "================================================================"
      tags:
        - report
        - diagnostics