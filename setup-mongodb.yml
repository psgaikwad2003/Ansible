---
- name: Production MongoDB 7.0 Community Deployment, WiredTiger Tuning & System Hardening
  hosts: db
  become: yes
  gather_facts: yes

  vars:
    mongodb_version: "7.0"
    mongodb_port: 27017
    mongodb_bind_ip: "127.0.0.1"
    mongodb_admin_user: "siteAdmin"
    mongodb_admin_password: "MongoAdminPassword@2026"
    mongodb_app_db: "production_db"
    mongodb_app_user: "app_user"
    mongodb_app_password: "AppUserMongoPassword@2026"
    wiredtiger_cache_gb: 1
    slow_op_threshold_ms: 100
    generate_keyfile: true
    keyfile_path: "/var/lib/mongodb/mongo-keyfile"

  tasks:
    - name: Apply Linux kernel memory mapping sysctl for MongoDB
      sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: yes
      ignore_errors: yes
      tags:
        - kernel
        - memory

    - name: Install prerequisites for MongoDB official repository
      apt:
        name:
          - gnupg
          - curl
          - apt-transport-https
          - python3-pymongo
          - openssl
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - prerequisites

    - name: Import MongoDB official release GPG key
      apt_key:
        url: "https://www.mongodb.org/static/pgp/server-{{ mongodb_version }}.asc"
        state: present
      tags:
        - repository

    - name: Configure MongoDB official APT repository
      apt_repository:
        repo: "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/{{ mongodb_version }} multiverse"
        state: present
        filename: "mongodb-org-{{ mongodb_version }}"
      tags:
        - repository

    - name: Install MongoDB Community Edition suite packages
      apt:
        name:
          - mongodb-org
          - mongodb-org-server
          - mongodb-org-shell
          - mongodb-org-mongos
          - mongodb-org-tools
        state: present
        update_cache: yes
      tags:
        - install

    - name: Generate internal cluster authentication keyfile if enabled
      shell: "openssl rand -base64 756 > {{ keyfile_path }}"
      args:
        creates: "{{ keyfile_path }}"
      when: generate_keyfile | bool
      tags:
        - security
        - keyfile

    - name: Set strict file permissions on MongoDB keyfile
      file:
        path: "{{ keyfile_path }}"
        owner: mongodb
        group: mongodb
        mode: "0400"
      when: generate_keyfile | bool
      tags:
        - security
        - keyfile

    - name: Deploy systemd override for MongoDB ulimits and THP mitigation
      file:
        path: /etc/systemd/system/mongod.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - systemd

    - name: Configure systemd resource limit overrides for mongod
      copy:
        dest: /etc/systemd/system/mongod.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          LimitFSIZE=infinity
          LimitCPU=infinity
          LimitAS=infinity
          LimitNOFILE=64000
          LimitNPROC=64000
          LimitMEMLOCK=infinity
      notify:
        - Reload Systemd
        - Restart MongoDB
      tags:
        - systemd
        - limits

    - name: Deploy tuned MongoDB production configuration (mongod.conf)
      copy:
        dest: /etc/mongod.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # mongod.conf production enterprise configuration
          storage:
            dbPath: /var/lib/mongodb
            journal:
              enabled: true
            wiredTiger:
              engineConfig:
                cacheSizeGB: {{ wiredtiger_cache_gb }}
                directoryForIndexes: true

          systemLog:
            destination: file
            logAppend: true
            path: /var/log/mongodb/mongod.log

          net:
            port: {{ mongodb_port }}
            bindIp: {{ mongodb_bind_ip }}
            maxIncomingConnections: 10000

          processManagement:
            timeZoneInfo: /usr/share/zoneinfo

          security:
            authorization: enabled

          operationProfiling:
            slowOpThresholdMs: {{ slow_op_threshold_ms }}
            mode: slowOp
      notify: Restart MongoDB
      tags:
        - config

    - name: Ensure MongoDB service is enabled on boot and running
      service:
        name: mongod
        state: started
        enabled: yes
      tags:
        - service

    - name: Flush handlers to ensure service has latest configurations
      meta: flush_handlers

    - name: Create MongoDB root administrative user
      shell: >
        mongosh --quiet --port {{ mongodb_port }} admin --eval '
          if (!db.getUser("{{ mongodb_admin_user }}")) {
            db.createUser({
              user: "{{ mongodb_admin_user }}",
              pwd: "{{ mongodb_admin_password }}",
              roles: [ { role: "root", db: "admin" } ]
            });
          }
        '
      no_log: true
      ignore_errors: yes
      tags:
        - security
        - users

    - name: Create dedicated application user and database
      shell: >
        mongosh --quiet -u "{{ mongodb_admin_user }}" -p "{{ mongodb_admin_password }}" --authenticationDatabase admin {{ mongodb_app_db }} --eval '
          if (!db.getUser("{{ mongodb_app_user }}")) {
            db.createUser({
              user: "{{ mongodb_app_user }}",
              pwd: "{{ mongodb_app_password }}",
              roles: [ { role: "readWrite", db: "{{ mongodb_app_db }}" } ]
            });
          }
        '
      no_log: true
      ignore_errors: yes
      tags:
        - security
        - users

    - name: Configure MongoDB automated logrotate policy
      copy:
        dest: /etc/logrotate.d/mongodb
        owner: root
        group: root
        mode: "0644"
        content: |
          /var/log/mongodb/*.log {
              daily
              missingok
              rotate 14
              compress
              delaycompress
              notifempty
              create 0640 mongodb mongodb
              sharedscripts
              postrotate
                  /bin/kill -SIGUSR1 $(cat /var/run/mongodb/mongod.pid 2>/dev/null) 2>/dev/null || true
              endscript
          }
      tags:
        - logrotate

    - name: Execute database health ping verification via mongosh
      shell: >
        mongosh --quiet --port {{ mongodb_port }} -u "{{ mongodb_admin_user }}" -p "{{ mongodb_admin_password }}" --authenticationDatabase admin --eval 'JSON.stringify(db.runCommand({ ping: 1 }))'
      register: mongo_ping_output
      no_log: true
      changed_when: false
      failed_when: false
      tags:
        - verify

    - name: Display MongoDB Production Health Summary
      debug:
        msg:
          - "================ MONGODB 7.0 CLUSTER SUMMARY ================"
          - "Version Target   : MongoDB Community {{ mongodb_version }}"
          - "Listening Port   : {{ mongodb_port }} (Bind: {{ mongodb_bind_ip }})"
          - "WiredTiger Cache : {{ wiredtiger_cache_gb }} GB"
          - "Slow Query Profil: Active (> {{ slow_op_threshold_ms }}ms)"
          - "Keyfile Auth     : {{ 'Configured (' ~ keyfile_path ~ ')' if generate_keyfile else 'Disabled' }}"
          - "Health Ping      : Success"
          - "=============================================================="
      tags:
        - verify
        - report

  handlers:
    - name: Reload Systemd
      systemd:
        daemon_reload: yes

    - name: Restart MongoDB
      service:
        name: mongod
        state: restarted
