---
- name: Deploy Self-Hosted GitHub Actions CI/CD Runner
  hosts: ci_runners
  become: yes

  vars:
    runner_version: "2.317.0"
    runner_arch: "linux-x64"
    runner_user: "actions-runner"
    runner_group: "actions-runner"
    runner_dir: "/opt/actions-runner"
    github_repo_url: "https://github.com/organization/production-app"
    runner_name: "prod-runner-01"
    runner_labels: "self-hosted,linux,x64,production"
    runner_token: "YOUR_RUNNER_REGISTRATION_TOKEN"

  tasks:

    - name: Install Runner System Prerequisites and Toolchain
      apt:
        name:
          - curl
          - tar
          - jq
          - git
          - build-essential
          - libssl-dev
          - libffi-dev
          - python3-pip
          - libicu-dev
          - ca-certificates
        state: present
        update_cache: yes

    - name: Create Dedicated Actions Runner System Group
      group:
        name: "{{ runner_group }}"
        state: present

    - name: Create Dedicated Actions Runner System User
      user:
        name: "{{ runner_user }}"
        group: "{{ runner_group }}"
        shell: /bin/bash
        home: "/home/{{ runner_user }}"
        create_home: yes
        state: present

    - name: Add Runner User to Docker Group if Docker Exists
      user:
        name: "{{ runner_user }}"
        groups: docker
        append: yes
      ignore_errors: yes

    - name: Create Runner Working Directory
      file:
        path: "{{ runner_dir }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_group }}"
        mode: "0755"

    - name: Download GitHub Actions Runner Release Package
      get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-{{ runner_arch }}-{{ runner_version }}.tar.gz"
        dest: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
        mode: "0644"

    - name: Extract Actions Runner Package
      unarchive:
        src: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
        dest: "{{ runner_dir }}"
        remote_src: yes
        owner: "{{ runner_user }}"
        group: "{{ runner_group }}"
        creates: "{{ runner_dir }}/run.sh"

    - name: Install Runner OS Dependencies
      shell: "./bin/installdependencies.sh"
      args:
        chdir: "{{ runner_dir }}"
      ignore_errors: yes

    - name: Configure GitHub Actions Runner
      become_user: "{{ runner_user }}"
      shell: >
        ./config.sh --url {{ github_repo_url }}
        --token {{ runner_token }}
        --name {{ runner_name }}
        --labels {{ runner_labels }}
        --work _work
        --unattended
        --replace
      args:
        chdir: "{{ runner_dir }}"
        creates: "{{ runner_dir }}/.runner"
      no_log: true
      when: runner_token != "YOUR_RUNNER_REGISTRATION_TOKEN"
      ignore_errors: yes

    - name: Deploy Systemd Service for GitHub Actions Runner
      copy:
        dest: /etc/systemd/system/github-actions-runner.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=GitHub Actions Self-Hosted Runner
          After=network.target

          [Service]
          ExecStart={{ runner_dir }}/run.sh
          User={{ runner_user }}
          WorkingDirectory={{ runner_dir }}
          KillMode=process
          KillSignal=SIGTERM
          TimeoutStopSec=5min
          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target

    - name: Reload Systemd Daemon
      systemd:
        daemon_reload: yes

    - name: Ensure GitHub Actions Runner Service is Enabled and Started
      service:
        name: github-actions-runner
        state: started
        enabled: yes
      when: runner_token != "YOUR_RUNNER_REGISTRATION_TOKEN"
      ignore_errors: yes

    - name: Cleanup Downloaded Runner Archive
      file:
        path: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
        state: absent
